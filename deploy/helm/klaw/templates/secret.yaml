{{- if not .Values.auth.existingSecret }}
{{- $name := include "klaw.authSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := .Values.auth.token }}
{{- if and (not $token) $existing }}{{ $token = index $existing.data "token" | b64dec }}{{ end }}
{{- if not $token }}{{ $token = randAlphaNum 40 }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "klaw.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ $token | quote }}
---
{{- end }}
{{- if and .Values.node.enabled (not .Values.anthropic.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "klaw.anthropicSecretName" . }}
  labels:
    {{- include "klaw.labels" . | nindent 4 }}
type: Opaque
stringData:
  ANTHROPIC_API_KEY: {{ required "anthropic.apiKey or anthropic.existingSecret is required when node.enabled=true" .Values.anthropic.apiKey | quote }}
{{- end }}
